
name: PayTeam CI

on:
  push:
    branches:
      - main
      - feature/phase2-kyc-reimplementation

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Install and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      APP_NAME: PayTeam
      APP_ENV: test
      APP_PORT: 3000

      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: payteam_test
      DB_PASSWORD: payteam_test_password
      DB_NAME: payteam_test

      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_KEY_PREFIX: payteam:test

      JWT_SECRET: ci_test_jwt_secret_at_least_32_characters_long
      KYC_OTP_SECRET: ci_test_otp_secret_at_least_32_characters_long
      ADMIN_SETUP_KEY: ci_test_admin_setup_key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test
